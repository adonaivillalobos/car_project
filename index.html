<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reel Search — Find a movie</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="brand">Reel Search</div>
    <h1 class="hero__title">Find a movie</h1>
    <form id="search-form" class="search">
      <input type="text" id="search-input" placeholder="Search by title…" autocomplete="off" />
      <button type="submit">Search</button>
    </form>

    <nav class="filters">
      <div class="filters__group">
        <label for="filter-year">Year</label>
        <input type="number" id="filter-year" placeholder="e.g. 2016" min="1900" max="2030" />
      </div>
      <div class="filters__group">
        <label for="filter-type">Type</label>
        <select id="filter-type">
          <option value="">Any</option>
          <option value="movie">Movie</option>
          <option value="series">Series</option>
          <option value="episode">Episode</option>
        </select>
      </div>
      <div class="filters__group">
        <label for="filter-sort">Sort</label>
        <select id="filter-sort">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </select>
      </div>
    </nav>
  </header>

  <main class="content">
    <p class="status" id="status"></p>
    <section class="grid" id="movie-grid"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
